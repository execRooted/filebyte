[package]
name = "filebyte"
version = "3.2.3"
edition = "2021"
authors = ["execRooted <rooted@execrooted.com>"]
description = "A CLI tool for analyzing files and directories with detailed metadata, permissions, and size information"
license = "MIT"
repository = "https://github.com/execRooted/filebyte"
homepage = "https://github.com/execRooted/filebyte"
readme = "README.md"
keywords = ["cli", "filesystem", "file-analysis", "permissions", "disk-usage"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "filebyte"
path = "src/main.rs"

[[bin]]
name = "fbt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
sysinfo = "0.30"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
infer = "0.15"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
md-5 = "0.10"
